<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonare of the Lake</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="mount"></div>

  <div id="overlay">
    <h1>Sonare of the Lake</h1>
    <p>Magical Mirai 2026</p>
    <div id="select-hint" style="display: none; position: absolute; top: 20px; width: 100%; text-align: center; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">
      Sail into a song card to select it
    </div>
    <button id="play-btn" disabled>Loading...</button>
    <span class="hint">W A S D to sail · Shift to sprint</span>
  </div>

  <div id="hud">
    <button id="pause-btn">⏸</button>
    <span id="time">0:00 / 0:00</span>
    <span id="song-info"></span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
