<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyage to Melody</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- ── Intro / Loading screen ───────────────────────────────────── -->
  <div id="intro-screen">

    <!-- Title text -->
    <div id="intro-title">
      <!-- Text content for the elements below is filled in by main.js
           applyTranslations() to avoid an EN/JA FOUC during the brief window
           between markup paint and module script execution. -->
      <div class="intro-logo" id="intro-logo"></div>

      <!-- Loading phase -->
      <div id="intro-progress-wrap">
        <div id="intro-progress-bar"><div id="intro-progress-fill"></div></div>
        <div id="intro-progress-pct">0%</div>
      </div>

      <!-- Ready phase (hidden until load complete) -->
      <button id="intro-start-btn" disabled></button>

      <!-- Secondary buttons — always enabled, shown alongside Start -->
      <div id="intro-secondary-btns">
        <button id="intro-boat-btn"></button>
        <button id="intro-setting-btn"></button>
      </div>
    </div>
  </div>

  <!-- ── Boat selection modal ─────────────────────────────────────── -->
  <div id="boat-modal" class="intro-modal hidden">
    <div class="intro-modal-panel">
      <h2 id="boat-modal-title"></h2>
      <div id="boat-grid"></div>
      <button class="intro-modal-close" id="boat-modal-close"></button>
    </div>
  </div>

  <!-- ── Settings modal ──────────────────────────────────────────── -->
  <div id="setting-modal" class="intro-modal hidden">
    <div class="intro-modal-panel">
      <h2 id="setting-modal-title"></h2>
      <div class="setting-row">
        <span id="lang-label"></span>
        <div id="lang-toggle">
          <!-- Language buttons intentionally hardcoded — labels always show in
               their respective native scripts, regardless of the active UI lang. -->
          <button id="lang-ja-btn" class="lang-btn">日本語</button>
          <button id="lang-en-btn" class="lang-btn">English</button>
        </div>
      </div>
      <button class="intro-modal-close" id="setting-modal-close"></button>
    </div>
  </div>

  <!-- Circle-reveal wipe: expands from center to uncover the 3D scene -->
  <div id="circle-reveal"></div>

  <!-- State transition fade -->
  <div id="transition-overlay"></div>

  <!-- Song select hint (text filled in by applyTranslations) -->
  <div id="select-hint"></div>

  <!-- Play scene loading overlay (text filled in by applyTranslations) -->
  <div id="overlay">
    <p></p>
  </div>

  <!-- Song progress bar — top of screen during play -->
  <div id="song-progress-wrap"><div id="song-progress-fill"></div></div>

  <!-- HUD (hidden until play scene) -->
  <div id="hud">
    <div class="hud-btns">
      <button id="pause-btn">⏸</button>
      <button id="hud-boat-btn" class="hud-icon-btn" aria-haspopup="true" aria-expanded="false" title="Boat">⛵</button>
      <button id="hud-setting-btn" class="hud-icon-btn" aria-haspopup="true" aria-expanded="false" title="Settings">⚙</button>
      <button id="fullscreen-btn" title="Fullscreen">⛶</button>
    </div>
    <span id="time">0:00 / 0:00</span>
    <span id="song-info"></span>
    <!-- controls-hint text is set by game-scene._setupHUD on play start. -->
    <span id="controls-hint"></span>
  </div>

  <!-- HUD popovers — non-modal floating panels anchored under the HUD buttons -->
  <div id="hud-boat-popover" class="hud-popover" role="dialog" aria-hidden="true">
    <div class="hud-popover-arrow"></div>
    <h3 class="hud-popover-title" id="hud-boat-title"></h3>
    <div id="hud-boat-grid" class="hud-boat-grid"></div>
  </div>

  <div id="hud-setting-popover" class="hud-popover" role="dialog" aria-hidden="true">
    <div class="hud-popover-arrow"></div>
    <h3 class="hud-popover-title" id="hud-setting-title"></h3>
    <div class="setting-row">
      <span id="hud-lang-label"></span>
      <div class="lang-toggle">
        <button id="hud-lang-ja-btn" class="lang-btn">日本語</button>
        <button id="hud-lang-en-btn" class="lang-btn">English</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
