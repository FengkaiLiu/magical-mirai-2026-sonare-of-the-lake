<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sonare of the Lake</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- ── Intro / Loading screen ───────────────────────────────────── -->
  <div id="intro-screen">

    <!-- Title text -->
    <div id="intro-title">
      <div class="intro-logo" id="intro-logo">Voyage to Melody</div>

      <!-- Loading phase -->
      <div id="intro-progress-wrap">
        <div id="intro-progress-bar"><div id="intro-progress-fill"></div></div>
        <div id="intro-progress-pct">0%</div>
      </div>

      <!-- Ready phase (hidden until load complete) -->
      <button id="intro-start-btn" disabled>Start</button>

      <!-- Secondary buttons — always enabled, shown alongside Start -->
      <div id="intro-secondary-btns">
        <button id="intro-boat-btn">ボート</button>
        <button id="intro-setting-btn">設定</button>
      </div>
    </div>
  </div>

  <!-- ── Boat selection modal ─────────────────────────────────────── -->
  <div id="boat-modal" class="intro-modal hidden">
    <div class="intro-modal-panel">
      <h2 id="boat-modal-title">ボート選択</h2>
      <div id="boat-grid"></div>
      <button class="intro-modal-close" id="boat-modal-close">閉じる</button>
    </div>
  </div>

  <!-- ── Settings modal ──────────────────────────────────────────── -->
  <div id="setting-modal" class="intro-modal hidden">
    <div class="intro-modal-panel">
      <h2 id="setting-modal-title">設定</h2>
      <div class="setting-row">
        <span id="lang-label">言語</span>
        <div id="lang-toggle">
          <button id="lang-ja-btn" class="lang-btn">日本語</button>
          <button id="lang-en-btn" class="lang-btn">English</button>
        </div>
      </div>
      <button class="intro-modal-close" id="setting-modal-close">閉じる</button>
    </div>
  </div>

  <!-- Circle-reveal wipe: expands from center to uncover the 3D scene -->
  <div id="circle-reveal"></div>

  <!-- State transition fade -->
  <div id="transition-overlay"></div>

  <!-- Song select hint -->
  <div id="select-hint">Sail into a song to begin</div>

  <!-- Play scene loading overlay -->
  <div id="overlay">
    <p>Loading...</p>
  </div>

  <!-- Song progress bar — top of screen during play -->
  <div id="song-progress-wrap"><div id="song-progress-fill"></div></div>

  <!-- HUD (hidden until play scene) -->
  <div id="hud">
    <div class="hud-btns">
      <button id="pause-btn">⏸</button>
      <button id="hud-boat-btn" class="hud-icon-btn" aria-haspopup="true" aria-expanded="false" title="Boat">⛵</button>
      <button id="hud-setting-btn" class="hud-icon-btn" aria-haspopup="true" aria-expanded="false" title="Settings">⚙</button>
      <button id="fullscreen-btn" title="Fullscreen">⛶</button>
    </div>
    <span id="time">0:00 / 0:00</span>
    <span id="song-info"></span>
    <span id="controls-hint">W A S D to sail</span>
  </div>

  <!-- HUD popovers — non-modal floating panels anchored under the HUD buttons -->
  <div id="hud-boat-popover" class="hud-popover" role="dialog" aria-hidden="true">
    <div class="hud-popover-arrow"></div>
    <h3 class="hud-popover-title" id="hud-boat-title">ボート</h3>
    <div id="hud-boat-grid" class="hud-boat-grid"></div>
  </div>

  <div id="hud-setting-popover" class="hud-popover" role="dialog" aria-hidden="true">
    <div class="hud-popover-arrow"></div>
    <h3 class="hud-popover-title" id="hud-setting-title">設定</h3>
    <div class="setting-row">
      <span id="hud-lang-label">言語</span>
      <div class="lang-toggle">
        <button id="hud-lang-ja-btn" class="lang-btn">日本語</button>
        <button id="hud-lang-en-btn" class="lang-btn">English</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
