<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonare of the Lake</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- ── Intro / Loading screen ───────────────────────────────────── -->
  <div id="intro-screen">

    <!-- Title text -->
    <div id="intro-title">
      <div class="intro-logo">Voyage to Melody</div>

      <!-- Loading phase -->
      <div id="intro-progress-wrap">
        <div id="intro-progress-bar"><div id="intro-progress-fill"></div></div>
        <div id="intro-progress-pct">0%</div>
      </div>

      <!-- Ready phase (hidden until load complete) -->
      <button id="intro-start-btn" disabled>Start</button>
    </div>
  </div>

  <!-- Circle-reveal wipe: expands from center to uncover the 3D scene -->
  <div id="circle-reveal"></div>

  <!-- State transition fade -->
  <div id="transition-overlay"></div>

  <!-- Song select hint -->
  <div id="select-hint">Sail into a song to begin</div>

  <!-- Play scene loading overlay -->
  <div id="overlay">
    <p>Loading...</p>
  </div>

  <!-- Song progress bar — top of screen during play -->
  <div id="song-progress-wrap"><div id="song-progress-fill"></div></div>

  <!-- HUD (hidden until play scene) -->
  <div id="hud">
    <div class="hud-btns">
      <button id="pause-btn">⏸</button>
      <button id="sky-btn">🌌 Sky View</button>
    </div>
    <span id="time">0:00 / 0:00</span>
    <span id="song-info"></span>
    <span id="controls-hint">W A S D to sail</span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
